name: tapo
description: "Local control and home screen widgets for TP-Link Tapo smart plugs."
publish_to: "none"

version: 1.1.3+3

environment:
  sdk: ">=3.11.0"
  flutter: ">=3.47.0"

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  home_widget: ^0.10.0
  pointycastle: ^4.0.0
  watch_it: ^2.5.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  mockito: ^5.8.1
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
